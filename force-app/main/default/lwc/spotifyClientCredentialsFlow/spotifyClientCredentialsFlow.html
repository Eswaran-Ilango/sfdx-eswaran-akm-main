<template>
    <lightning-card title="Spotify Client Credentials Flow" icon-name="custom:custom63">
        <lightning-button label="Get New Releases" brand="brand-outline"
            onclick={handleGetNewRelease}></lightning-button>
        <div lwc:if={albums}>
            <lightning-layout multiple-rows>
                <!-- <div > -->
                    <lightning-layout-item flexibility="auto" size="3" padding="around-small" for:each={albums} for:item="album" key={album.albumName}>
                        <div class="custom-box slds-box slds-p-around_medium slds-text-align_center">
                            <div>Album Name<lightning-badge label={album.albumName}
                                class="slds-badge_inverse"></lightning-badge></div>
                            <div>Artist Name<lightning-badge label={album.artistName}
                                class="slds-badge_inverse"></lightning-badge></div>
                            <img src={album.albumImgUrl} alt="New Releases" class="slds-p-around_small">
                        </div>
                    </lightning-layout-item>
                    
                    <!-- <lightning-carousel-image
                        src = {album.albumImgUrl}
                        header = "First Card"
                        description = "First card description."
                        alternative-text = "First card accessible description."
                        href = "javascript:void(0);">
                    </lightning-carousel-image> -->
                <!-- </div> -->
            </lightning-layout>
        </div>
    </lightning-card>
</template>
